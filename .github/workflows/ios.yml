name: iOS build and test

# The only way to build/test an iOS app from Windows: GitHub's macOS runners
# have the real Xcode and the real iOS Simulator.
# Free tier: 2,000 macOS minutes/month on public repos.
#
# Produces:
#   - XCTest results (unit tests run on the simulator)
#   - an UNSIGNED .ipa artifact that Sideloadly/AltStore can sign on Windows
#     with your own Apple ID (free account = 7 day expiry, re-sign weekly)

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

jobs:
  build:
    # macOS 14 was RETIRED from GitHub Actions on 2026-11-02 (verified against
    # actions/runner-images README on 2026-11-04). Available labels at that time:
    # macos-15, macos-15-arm64, macos-26, macos-26-arm64, macos-latest.
    # GitHub retires old images roughly yearly - tools/ci_lint.py checks this.
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v7

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes | sed -n '1,10p'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate && xcodebuild -list -project GeorgePPM.xcodeproj

      # Runner images rotate their simulator names, so never hardcode one.
      - name: Pick an available iPhone simulator
        run: |
          NAME=$(xcrun simctl list devices available \
                 | grep -oE 'iPhone 1[0-9]( Pro| Plus| mini)?' \
                 | sort -u | tail -1)
          if [ -z "$NAME" ]; then
            echo "no iPhone simulator found; available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $NAME"
          echo "SIM_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Run unit tests on the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project GeorgePPM.xcodeproj \
            -scheme GeorgePPM \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ios/TestResults.xcresult
          if-no-files-found: warn

      - name: Build unsigned .ipa
        run: |
          xcodebuild archive \
            -project GeorgePPM.xcodeproj \
            -scheme GeorgePPM \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/GeorgePPM.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          mkdir -p build/Payload
          cp -R build/GeorgePPM.xcarchive/Products/Applications/GeorgePPM.app build/Payload/
          cd build && zip -qry GeorgePPM-unsigned.ipa Payload
          ls -lh GeorgePPM-unsigned.ipa

      # ---------------------------------------------------------------- signing
      # Optional. Runs only when the four signing secrets are configured.
      # Without them the workflow still succeeds and uploads the unsigned .ipa.
      - name: Sign the .ipa (optional)
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$CERT_B64" ]; then
            echo "No signing secrets configured - keeping the unsigned .ipa."
            echo "See ios/README.md to add them."
            exit 0
          fi

          echo "Importing certificate into a temporary keychain..."
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '\"')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" \
             ~/Library/MobileDevice/Provisioning\ Profiles/

          echo "Re-signing the app..."
          APP="build/GeorgePPM.xcarchive/Products/Applications/GeorgePPM.app"
          /usr/bin/codesign --force --sign "Apple Development" \
            --entitlements /dev/null --timestamp=none "$APP"
          /usr/bin/codesign --verify --verbose=2 "$APP"

          rm -rf build/Payload build/GeorgePPM-signed.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry GeorgePPM-signed.ipa Payload
          ls -lh GeorgePPM-signed.ipa

      - name: Upload signed .ipa
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GeorgePPM-signed-ipa
          path: ios/build/GeorgePPM-signed.ipa
          if-no-files-found: ignore

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v7
        with:
          name: GeorgePPM-unsigned-ipa
          path: ios/build/GeorgePPM-unsigned.ipa
